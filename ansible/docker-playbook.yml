- name: A playbook to install Docker on a VM
  hosts: localhost
  user: ubuntu
  become: yes

  vars:
   myPath: /home/ubuntu/


  tasks:
  - name: 1. Update APT Package Manager
    apt:
      

  - name: 2. Uninstall the unscd package
    apt:
      

  - name: 3. Install dependency packages
    apt:
      name={{ item }}
    with_items:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common

  - name: 4. Get APT Key
    shell:
      cmd: curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor --yes -o /etc/apt/trusted.gpg.d/docker.gpg

  - name: 5. Confirm Fingerprint
    shell:
      cmd: gpg --show-keys --fingerprint /etc/apt/trusted.gpg.d/docker.gpg

  - name: 6. Add APT Repository
    apt_repository:
      repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
      state: present

  - name: 7. Update Package Manager
    apt:
      update_cache: yes

  - name: 8. Install Docker packages
    apt:
      name={{ item }}
    with_items:
      - docker-ce
      - docker-ce-cli
      - containerd.io

  - name: 9. Create bash Script for the Permissions Commands
    become: no
    copy:
      dest: /home/ubuntu/ansible/docker.sh
      content: |
        #! /bin/bash
        sudo groupadd docker
        sudo usermod -aG docker $USER
        sudo addgroup --system docker
        sudo adduser $USER docker
        newgrp docker

  - name: 10. Change File permissions so that it can be executed
    file:
      path: /home/ubuntu/ansible/docker.sh
      owner: ubuntu
      group: ubuntu
      mode: '777'

  - name: 11. Execute Script
    shell:
      cmd: /home/ubuntu/ansible/docker.sh
